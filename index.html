<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Yasam DNS Manager V1</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:#050505;
    color:#ddd;
    font-family:Consolas,Monaco,"Courier New",monospace;
}

body{
    overflow-x:hidden;
}

.hidden{
    display:none!important;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-card{
    width:100%;
    max-width:400px;

    background:#0b0b0b;

    border:1px solid #292929;

    border-radius:14px;

    padding:25px;

    box-shadow:
        0 15px 50px #000;
}

.logo{
    color:#00ff66;

    font-size:23px;

    font-weight:bold;

    margin-bottom:5px;
}

.subtitle{
    color:#666;

    font-size:12px;

    margin-bottom:20px;
}

label{
    display:block;

    color:#888;

    font-size:12px;

    margin:
        13px
        0
        6px;
}

input,
select{
    width:100%;

    background:#111;

    color:#eee;

    border:1px solid #303030;

    border-radius:8px;

    padding:11px;

    outline:none;
}

input:focus,
select:focus{
    border-color:#00c853;
}

.btn{
    border:1px solid #303030;

    background:#141414;

    color:#ddd;

    border-radius:8px;

    padding:
        9px
        12px;

    transition:.12s;
}

.btn:hover{
    background:#222;
}

.btn:active{
    transform:scale(.97);
}

.primary{
    background:#008f3f;

    border-color:#00c853;

    color:#fff;

    width:100%;

    margin-top:16px;
}

.primary:hover{
    background:#00c853;
}

.error{
    color:#ff5555;

    font-size:12px;

    margin-top:10px;
}

.success{
    color:#00ff66;

    font-size:12px;

    margin-top:10px;
}


/* =========================
   HEADER
========================= */

#app{
    min-height:100vh;
}

.header{
    min-height:60px;

    background:#090909;

    border-bottom:1px solid #222;

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        9px
        12px;

    position:sticky;

    top:0;

    z-index:20;
}

.brand{
    color:#00ff66;

    font-weight:bold;

    white-space:nowrap;

    margin-right:auto;
}

.user-badge{
    color:#888;

    font-size:11px;
}

.repo-domain{
    color:#00aaff;

    font-size:12px;

    max-width:230px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================
   CONTENT
========================= */

.container{
    width:100%;

    max-width:1000px;

    margin:auto;

    padding:15px;
}

.card{
    background:#0b0b0b;

    border:1px solid #252525;

    border-radius:12px;

    padding:15px;

    margin-bottom:15px;
}

.card-title{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:10px;
}

.card-title h2{
    margin:0;

    color:#00ff66;

    font-size:16px;
}


/* =========================
   FORM
========================= */

.form-grid{
    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:10px;
}

.full{
    grid-column:
        1 /
        -1;
}

.add-button{
    margin-top:12px;
}


/* =========================
   RECORD
========================= */

.search{
    margin-bottom:10px;
}

.record{
    border:1px solid #222;

    border-radius:9px;

    background:#080808;

    padding:12px;

    margin-bottom:8px;
}

.record-top{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:10px;
}

.record-name{
    color:#00ff66;

    font-weight:bold;

    word-break:break-all;
}

.record-type{
    color:#00aaff;

    border:1px solid #16405c;

    border-radius:5px;

    padding:
        3px
        6px;

    font-size:10px;

    flex-shrink:0;
}

.record-content{
    color:#aaa;

    font-size:12px;

    margin-top:7px;

    word-break:break-all;
}

.record-info{
    color:#666;

    font-size:11px;

    margin-top:6px;
}

.actions{
    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:10px;
}

.proxy-on{
    color:#ff9f00;
}

.proxy-off{
    color:#888;
}

.delete{
    color:#ff5555;
}


/* =========================
   STATUS
========================= */

.status{
    position:fixed;

    left:50%;

    bottom:15px;

    transform:
        translateX(-50%);

    background:#111;

    border:1px solid #333;

    border-radius:8px;

    padding:
        10px
        15px;

    z-index:100;

    max-width:90%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    font-size:12px;
}

.status.ok{
    color:#00ff66;
}

.status.bad{
    color:#ff5555;
}


/* =========================
   MODAL
========================= */

.modal-bg{
    position:fixed;

    inset:0;

    background:#000c;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;
}

.modal{
    width:100%;

    max-width:500px;

    max-height:90vh;

    overflow:auto;

    background:#0b0b0b;

    border:1px solid #333;

    border-radius:12px;

    padding:18px;
}

.modal-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;
}

.modal-header h2{
    color:#00ff66;

    font-size:16px;

    margin:0;
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:7px;

    margin-top:15px;
}


/* =========================
   LOADING
========================= */

.loading{
    opacity:.5!important;

    pointer-events:none!important;
}

.empty{
    text-align:center;

    color:#666;

    padding:35px 10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .header{
        flex-wrap:wrap;
    }

    .brand{
        width:100%;

        margin-right:0;
    }

    .user-badge{
        margin-right:auto;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .container{
        padding:10px;
    }

    .record-top{
        flex-direction:column;
    }

    .record-type{
        align-self:flex-start;
    }

    .actions .btn{
        flex:1;

        min-width:
            80px;
    }

}


/* =========================
   VERY SMALL
========================= */

@media(max-width:380px){

    .actions .btn{
        min-width:
            70px;

        padding:
            8px
            5px;

        font-size:11px;
    }

}

</style>
</head>


<body>

<script>


/* =====================================================
   CONFIG
===================================================== */


/*
 * ================================================
 * ISI 2 BAGIAN INI
 * ================================================
 *
 * Jangan hapus tanda kutip.
 */


/* TOKEN CLOUDFLARE */

const CLOUDFLARE_API_TOKEN =
    "f603d6b3517f5867edd48cf3c457f961";


/* ZONE ID */

const CLOUDFLARE_ZONE_ID =
    "45c900cd8ce4bf53b319e268d241d856";


/*
 * ================================================
 * RAW GITHUB USERS.JSON
 * ================================================
 *
 * Contoh:
 *
 * https://raw.githubusercontent.com/Yasamsen/auth/main/users.json
 *
 */

const USERS_URL =
    "https://raw.githubusercontent.com/Yasamsen/subdo/users.json";


/*
 * Nama domain utama.
 */

const MAIN_DOMAIN =
    "yasamdev.web.id";


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let records = [];

let editingRecord = null;


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
    document.getElementById(
        "loginPage"
    );

const app =
    document.getElementById(
        "app"
    );


/* =====================================================
   SESSION
===================================================== */

const SESSION_KEY =
    "yasam_dns_session_v1";


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   CLOUDFLARE REQUEST
===================================================== */

async function cloudflare(
    endpoint,
    options = {}
){

    const response =
        await fetch(
            "https://api.cloudflare.com/client/v4"
            +
            endpoint,
            {

                method:
                    options.method ||
                    "GET",

                headers:{

                    "Authorization":
                        "Bearer " +
                        CLOUDFLARE_API_TOKEN,

                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"

                },

                body:
                    options.body
                    ? JSON.stringify(
                        options.body
                    )
                    : undefined

            }
        );


    const data =
        await response.json();


    if(
        !response.ok ||
        data.success === false
    ){

        const error =
            data?.errors?.[0]?.message ||
            "Cloudflare API error.";

        throw new Error(
            error
        );

    }


    return data;

}


/* =====================================================
   LOGIN
===================================================== */

document.getElementById(
    "loginBtn"
).onclick =
    login;


document.getElementById(
    "passwordInput"
).addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            login();

        }

    }
);


document.getElementById(
    "usernameInput"
).addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            login();

        }

    }
);


async function login(){

    const button =
        document.getElementById(
            "loginBtn"
        );


    const username =
        document.getElementById(
            "usernameInput"
        ).value.trim();


    const password =
        document.getElementById(
            "passwordInput"
        ).value;


    if(
        !username ||
        !password
    ){

        setLoginStatus(
            "Username dan password wajib diisi.",
            false
        );

        return;

    }


    button.classList.add(
        "loading"
    );

    button.textContent =
        "...";


    try{

        const response =
            await fetch(
                USERS_URL +
                "?t=" +
                Date.now()
            );


        if(
            !response.ok
        ){

            throw new Error(
                "users.json tidak dapat diakses."
            );

        }


        const data =
            await response.json();


        const users =
            Array.isArray(
                data
            )
            ? data
            : data.users;


        if(
            !Array.isArray(users)
        ){

            throw new Error(
                "Format users.json salah."
            );

        }


        const user =
            users.find(
                item =>
                    item.username ===
                    username &&
                    item.password ===
                    password &&
                    item.active !== false
            );


        if(!user){

            throw new Error(
                "Username atau password salah."
            );

        }


        /*
         * Session browser.
         */

        currentUser =
            {
                username:
                    user.username,

                loginAt:
                    Date.now()
            };


        sessionStorage.setItem(
            SESSION_KEY,
            JSON.stringify(
                currentUser
            )
        );


        showApp();


    }catch(error){

        setLoginStatus(
            error.message,
            false
        );

    }finally{

        button.classList.remove(
            "loading"
        );

        button.textContent =
            "LOGIN";

    }

}


/* =====================================================
   AUTO SESSION
===================================================== */

function checkSession(){

    try{

        const saved =
            sessionStorage.getItem(
                SESSION_KEY
            );


        if(!saved){

            return;

        }


        currentUser =
            JSON.parse(
                saved
            );


        if(
            currentUser?.username
        ){

            showApp();

        }

    }catch{

        sessionStorage.removeItem(
            SESSION_KEY
        );

    }

}


checkSession();


/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

    loginPage.classList.add(
        "hidden"
    );

    app.classList.remove(
        "hidden"
    );


    document.getElementById(
        "currentUser"
    ).textContent =
        "@" +
        currentUser.username;


    loadRecords();

}


/* =====================================================
   LOGIN STATUS
===================================================== */

function setLoginStatus(
    message,
    success
){

    const box =
        document.getElementById(
            "loginStatus"
        );


    box.className =
        success
        ? "success"
        : "error";


    box.textContent =
        message;

}


/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
    "logoutBtn"
).onclick =
    event => {

        const button =
            event.currentTarget;


        button.classList.add(
            "loading"
        );

        button.textContent =
            "...";


        setTimeout(
            () => {

                sessionStorage.removeItem(
                    SESSION_KEY
                );

                location.reload();

            },
            250
        );

    };


/* =====================================================
   LOAD RECORDS
===================================================== */

async function loadRecords(){

    const box =
        document.getElementById(
            "records"
        );


    box.innerHTML =
        `
        <div class="empty">
            Loading...
        </div>
        `;


    try{

        const data =
            await cloudflare(
                `/zones/${CLOUDFLARE_ZONE_ID}/dns_records?per_page=100`
            );


        records =
            data.result || [];


        renderRecords();


    }catch(error){

        box.innerHTML =
            `
            <div class="empty"
                 style="color:#ff5555">

                ${escapeHtml(
                    error.message
                )}

            </div>
            `;

    }

}


/* =====================================================
   RENDER RECORDS
===================================================== */

function renderRecords(){

    const box =
        document.getElementById(
            "records"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
            .trim()
            .toLowerCase();


    const filtered =
        records.filter(
            record =>
                record.name
                    .toLowerCase()
                    .includes(
                        search
                    ) ||

                record.content
                    .toLowerCase()
                    .includes(
                        search
                    )
        );


    if(!filtered.length){

        box.innerHTML =
            `
            <div class="empty">
                Tidak ada DNS record.
            </div>
            `;

        return;

    }


    box.innerHTML =
        "";


    filtered.forEach(
        record => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "record";


            const proxyText =
                record.proxied
                ? "🟠 Proxied"
                : "⚪ DNS Only";


            const proxyClass =
                record.proxied
                ? "proxy-on"
                : "proxy-off";


            div.innerHTML =
                `

                <div class="record-top">

                    <div class="record-name">
                        ${escapeHtml(
                            record.name
                        )}
                    </div>

                    <div class="record-type">
                        ${escapeHtml(
                            record.type
                        )}
                    </div>

                </div>


                <div class="record-content">
                    ${escapeHtml(
                        record.content
                    )}
                </div>


                <div class="record-info">

                    TTL:
                    ${
                        record.ttl === 1
                        ? "Automatic"
                        : record.ttl + "s"
                    }

                    &nbsp; • &nbsp;

                    <span class="${proxyClass}">
                        ${proxyText}
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="btn"
                        data-action="edit"
                    >
                        ✏️ Edit
                    </button>


                    <button
                        class="btn"
                        data-action="proxy"
                    >
                        🟠 Proxy
                    </button>


                    <button
                        class="btn delete"
                        data-action="delete"
                    >
                        🗑️ Delete
                    </button>

                </div>

                `;


            const editButton =
                div.querySelector(
                    '[data-action="edit"]'
                );


            const proxyButton =
                div.querySelector(
                    '[data-action="proxy"]'
                );


            const deleteButton =
                div.querySelector(
                    '[data-action="delete"]'
                );


            editButton.onclick =
                () => {

                    editRecord(
                        record
                    );

                };


            proxyButton.onclick =
                () => {

                    toggleProxy(
                        record,
                        proxyButton
                    );

                };


            deleteButton.onclick =
                () => {

                    deleteRecord(
                        record,
                        div,
                        deleteButton
                    );

                };


            box.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    renderRecords
);


/* =====================================================
   REFRESH
===================================================== */

document.getElementById(
    "refreshBtn"
).onclick =
    async event => {

        const button =
            event.currentTarget;


        button.classList.add(
            "loading"
        );

        button.textContent =
            "...";


        try{

            await loadRecords();

        }finally{

            button.classList.remove(
                "loading"
            );

            button.textContent =
                "↻";

        }

    };


/* =====================================================
   DOMAIN NAME
===================================================== */

function normalizeName(
    name
){

    name =
        name.trim();


    if(
        !name
    ){

        return "";

    }


    /*
     * Kalau user memasukkan
     * router
     *
     * menjadi:
     *
     * router.yasamdev.web.id
     */


    if(
        !name.includes(".")
    ){

        return (
            name +
            "." +
            MAIN_DOMAIN
        );

    }


    return name;

}


/* =====================================================
   ADD RECORD
===================================================== */

document.getElementById(
    "addBtn"
).onclick =
    addRecord;


async function addRecord(){

    const button =
        document.getElementById(
            "addBtn"
        );


    let name =
        document.getElementById(
            "recordName"
        ).value;


    const type =
        document.getElementById(
            "recordType"
        ).value;


    const content =
        document.getElementById(
            "recordContent"
        ).value.trim();


    const ttl =
        Number(
            document.getElementById(
                "recordTTL"
            ).value
        );


    const proxied =
        document.getElementById(
            "recordProxy"
        ).value ===
        "true";


    name =
        normalizeName(
            name
        );


    if(
        !name ||
        !content
    ){

        setAddStatus(
            "Nama dan target wajib diisi.",
            false
        );

        return;

    }


    button.classList.add(
        "loading"
    );

    button.textContent =
        "...";


    try{

        /*
         * Cari record yang sama.
         */

        const existing =
            await cloudflare(
                `/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${encodeURIComponent(name)}&type=${type}`
            );


        if(
            existing.result?.length
        ){

            /*
             * UPDATE / OVERWRITE
             */

            const record =
                existing.result[0];


            await cloudflare(
                `/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${record.id}`,
                {

                    method:"PUT",

                    body:{

                        type,

                        name,

                        content,

                        ttl,

                        proxied

                    }

                }
            );


            setAddStatus(
                "✓ Record sudah ada dan berhasil ditimpa.",
                true
            );


        }else{

            /*
             * CREATE
             */

            await cloudflare(
                `/zones/${CLOUDFLARE_ZONE_ID}/dns_records`,
                {

                    method:"POST",

                    body:{

                        type,

                        name,

                        content,

                        ttl,

                        proxied

                    }

                }
            );


            setAddStatus(
                "✓ DNS record berhasil dibuat.",
                true
            );

        }


        document.getElementById(
            "recordName"
        ).value = "";


        document.getElementById(
            "recordContent"
        ).value = "";


        await loadRecords();


    }catch(error){

        setAddStatus(
            error.message,
            false
        );

    }finally{

        button.classList.remove(
            "loading"
        );

        button.textContent =
            "ADD RECORD";

    }

}


/* =====================================================
   EDIT RECORD
===================================================== */

function editRecord(
    record
){

    editingRecord =
        record;


    document.getElementById(
        "editId"
    ).value =
        record.id;


    document.getElementById(
        "editName"
    ).value =
        record.name;


    document.getElementById(
        "editType"
    ).value =
        record.type;


    document.getElementById(
        "editContent"
    ).value =
        record.content;


    document.getElementById(
        "editTTL"
    ).value =
        String(
            record.ttl
        );


    document.getElementById(
        "editProxy"
    ).value =
        String(
            record.proxied
        );


    document.getElementById(
        "editModal"
    ).classList.remove(
        "hidden"
    );

}


/* =====================================================
   CLOSE EDIT
===================================================== */

function closeEdit(){

    document.getElementById(
        "editModal"
    ).classList.add(
        "hidden"
    );


    editingRecord =
        null;

}


document.getElementById(
    "closeEdit"
).onclick =
    closeEdit;


document.getElementById(
    "cancelEdit"
).onclick =
    closeEdit;


/* =====================================================
   SAVE EDIT
===================================================== */

document.getElementById(
    "saveEdit"
).onclick =
    async event => {

        const button =
            event.currentTarget;


        if(
            !editingRecord
        ){

            return;

        }


        const name =
            document.getElementById(
                "editName"
            ).value.trim();


        const type =
            document.getElementById(
                "editType"
            ).value;


        const content =
            document.getElementById(
                "editContent"
            ).value.trim();


        const ttl =
            Number(
                document.getElementById(
                    "editTTL"
                ).value
            );


        const proxied =
            document.getElementById(
                "editProxy"
            ).value ===
            "true";


        if(
            !name ||
            !content
        ){

            showStatus(
                "Nama dan target wajib diisi.",
                false
            );

            return;

        }


        button.classList.add(
            "loading"
        );

        button.textContent =
            "...";


        try{

            await cloudflare(
                `/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${editingRecord.id}`,
                {

                    method:"PUT",

                    body:{

                        type,

                        name,

                        content,

                        ttl,

                        proxied

                    }

                }
            );


            closeEdit();


            showStatus(
                "✓ DNS record berhasil diupdate.",
                true
            );


            await loadRecords();


        }catch(error){

            showStatus(
                error.message,
                false
            );

        }finally{

            button.classList.remove(
                "loading"
            );

            button.textContent =
                "Save";

        }

    };


/* =====================================================
   TOGGLE PROXY
===================================================== */

async function toggleProxy(
    record,
    button
){

    button.classList.add(
        "loading"
    );

    button.textContent =
        "...";


    try{

        await cloudflare(
            `/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${record.id}`,
            {

                method:"PUT",

                body:{

                    type:
                        record.type,

                    name:
                        record.name,

                    content:
                        record.content,

                    ttl:
                        record.ttl,

                    proxied:
                        !record.proxied

                }

            }
        );


        showStatus(
            record.proxied
            ? "✓ Proxy dimatikan."
            : "✓ Proxy diaktifkan.",
            true
        );


        await loadRecords();


    }catch(error){

        showStatus(
            error.message,
            false
        );


    }finally{

        button.classList.remove(
            "loading"
        );

        button.textContent =
            "🟠 Proxy";

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteRecord(
    record,
    element,
    button
){

    if(
        !confirm(
            "Hapus DNS record:\n\n" +
            record.name +
            "?"
        )
    ){

        return;

    }


    button.classList.add(
        "loading"
    );

    button.textContent =
        "...";


    try{

        await cloudflare(
            `/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${record.id}`,
            {
                method:"DELETE"
            }
        );


        /*
         * Hilangkan langsung dari UI.
         */

        element.remove();


        records =
            records.filter(
                item =>
                    item.id !==
                    record.id
            );


        showStatus(
            "✓ Record berhasil dihapus.",
            true
        );


    }catch(error){

        showStatus(
            error.message,
            false
        );


        button.classList.remove(
            "loading"
        );

        button.textContent =
            "🗑️ Delete";

    }

}


/* =====================================================
   STATUS
===================================================== */

let statusTimer;


function showStatus(
    message,
    success
){

    const box =
        document.getElementById(
            "status"
        );


    clearTimeout(
        statusTimer
    );


    box.className =
        "status " +
        (
            success
            ? "ok"
            : "bad"
        );


    box.textContent =
        message;


    statusTimer =
        setTimeout(
            () => {

                box.classList.add(
                    "hidden"
                );

            },
            3500
        );

}


function setAddStatus(
    message,
    success
){

    const box =
        document.getElementById(
            "addStatus"
        );


    box.className =
        success
        ? "success"
        : "error";


    box.textContent =
        message;

}
