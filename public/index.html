<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yasam DNS Panel</title>
<style>
:root{--bg:#0b1020;--panel:#11182b;--panel2:#172039;--text:#eef3ff;--muted:#8e9ab5;--line:#26324f;--accent:#6d7cff;--danger:#ef5b6d;--ok:#34d399}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#080d19,#10182b);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:22px;box-shadow:0 20px 60px #0006}
.logo{font-size:25px;font-weight:800;margin-bottom:7px}.muted{color:var(--muted)}input,select,textarea{width:100%;background:#0c1426;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:#202b47}.btn.danger{background:#a93448}.btn.small{padding:7px 10px;font-size:13px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0a1020;border-right:1px solid var(--line);padding:20px;position:sticky;top:0;height:100vh}.nav button{width:100%;text-align:left;margin-top:7px;background:transparent;color:#b8c2d9;border:0;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#1a2541;color:#fff}.main{padding:25px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.num{font-size:28px;font-weight:800;margin-top:5px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input{max-width:340px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{color:#9eabc4;font-weight:600}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#202b47;font-size:12px}.orange{color:#ffb36b}.green{color:#54e2a7}.actions{display:flex;gap:6px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:5}.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(650px,100%);padding:22px;max-height:90vh;overflow:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#aeb8ce;margin-bottom:6px}.toast{position:fixed;right:20px;bottom:20px;background:#172039;border:1px solid var(--line);padding:12px 15px;border-radius:12px;z-index:10}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.cards{grid-template-columns:1fr 1fr}.main{padding:15px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="login-card">
  <div class="logo">⚡ Yasam DNS Panel</div><p class="muted">Cloudflare DNS management</p>
  <form id="loginForm"><div class="field"><label>Admin password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">Login</button></form>
  <p id="loginErr" class="muted"></p>
 </div>
</div>
<div id="app" class="layout hidden">
<aside class="side">
 <div class="logo">⚡ Yasam</div><div class="muted" style="font-size:13px;margin-bottom:18px">DNS Control Panel</div>
 <div class="nav">
  <button data-page="dashboard" class="active">📊 Dashboard</button>
  <button data-page="records">🌐 DNS Records</button>
  <button data-page="checker">🔎 DNS Checker</button>
  <button data-page="activity">🧾 Activity Log</button>
 </div>
 <button id="logout" class="btn secondary" style="width:100%;margin-top:25px">Logout</button>
</aside>
<main class="main">
 <div class="top"><div><h1 id="title" style="margin:0">Dashboard</h1><div id="zoneLabel" class="muted">Loading…</div></div><button id="addBtn" class="btn">+ Add Record</button></div>
 <section id="dashboard" class="page">
  <div class="cards">
   <div class="card"><div class="muted">Total records</div><div id="total" class="num">—</div></div>
   <div class="card"><div class="muted">A / AAAA</div><div id="ipCount" class="num">—</div></div>
   <div class="card"><div class="muted">CNAME</div><div id="cnameCount" class="num">—</div></div>
   <div class="card"><div class="muted">Proxied</div><div id="proxyCount" class="num">—</div></div>
  </div>
  <div class="box" style="margin-top:15px"><h3>Recent records</h3><div id="recent"></div></div>
 </section>
 <section id="records" class="page hidden">
  <div class="box"><div class="toolbar"><input id="search" placeholder="Search subdomain, target, type…"><select id="filter"><option value="">All types</option><option>A</option><option>AAAA</option><option>CNAME</option><option>TXT</option><option>MX</option><option>NS</option><option>CAA</option><option>SRV</option></select><button id="refresh" class="btn secondary">↻ Refresh</button></div>
  <div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Type</th><th>Content</th><th>TTL</th><th>Proxy</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
 </section>
 <section id="checker" class="page hidden"><div class="box"><h3>DNS Checker</h3><p class="muted">Query public DNS through Google Public DNS.</p><div class="toolbar"><input id="checkName" placeholder="api.example.com"><button id="checkBtn" class="btn">Check</button></div><pre id="checkResult" style="white-space:pre-wrap;background:#0a1020;padding:15px;border-radius:12px;min-height:120px">Enter a hostname.</pre></div></section>
 <section id="activity" class="page hidden"><div class="box"><h3>Activity Log</h3><div id="activityList"></div><p id="activityNote" class="muted"></p></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Add DNS Record</h2><button id="closeModal" class="btn secondary">✕</button></div>
<form id="recordForm"><input type="hidden" id="recordId"><div class="grid2">
<div class="field"><label>Name / subdomain</label><input id="name" placeholder="api or api.example.com" required></div>
<div class="field"><label>Type</label><select id="type"><option>A</option><option>AAAA</option><option>CNAME</option><option>TXT</option><option>MX</option><option>NS</option><option>CAA</option><option>SRV</option></select></div>
</div>
<div class="field"><label>Content / target</label><textarea id="content" rows="3" placeholder="1.2.3.4" required></textarea></div>
<div class="grid2"><div class="field"><label>TTL</label><select id="ttl"><option value="auto">Auto</option><option value="60">60</option><option value="300">300</option><option value="600">600</option><option value="1800">1800</option><option value="3600">3600</option><option value="86400">86400</option></select></div><div class="field"><label>Priority (MX)</label><input id="priority" type="number" value="10"></div></div>
<div class="field"><label><input id="proxied" type="checkbox" style="width:auto;margin-right:7px"> Cloudflare Proxy (A/AAAA/CNAME)</label></div>
<div class="field"><label>Comment (optional)</label><input id="comment" maxlength="500"></div>
<button class="btn" style="width:100%">Save Record</button></form></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s); let records=[]; let currentPage="dashboard";
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch{} if(r.status===401){showLogin();throw new Error("Unauthorized")} if(!r.ok||j.success===false)throw new Error(j.error||"Request failed");return j}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2800)}
function showLogin(){$("#app").classList.add("hidden");$("#login").classList.remove("hidden")}
function showApp(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");load()}
async function boot(){try{const s=await api("/api/session");if(s.authenticated)showApp()}catch{}}
$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#loginErr").textContent="";try{await api("/api/login",{method:"POST",body:JSON.stringify({password:$("#password").value})});$("#password").value="";showApp()}catch(err){$("#loginErr").textContent=err.message}}
$("#logout").onclick=async()=>{await api("/api/logout",{method:"POST"});showLogin()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function navigate(p){currentPage=p;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("hidden",x.id!==p));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));$("#title").textContent={dashboard:"Dashboard",records:"DNS Records",checker:"DNS Checker",activity:"Activity Log"}[p];$("#addBtn").classList.toggle("hidden",p!=="records");if(p==="activity")loadActivity()}
$("#addBtn").onclick=()=>openModal();$("#closeModal").onclick=()=>$("#modal").classList.add("hidden");
$("#type").onchange=()=>{const t=$("#type").value;$("#proxied").disabled=!["A","AAAA","CNAME"].includes(t)}
$("#recordForm").onsubmit=async e=>{e.preventDefault();const id=$("#recordId").value;const body={name:$("#name").value,type:$("#type").value,content:$("#content").value,ttl:$("#ttl").value,priority:$("#priority").value,proxied:$("#proxied").checked,comment:$("#comment").value};try{if(id)await api("/api/record?id="+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(body)});else await api("/api/records",{method:"POST",body:JSON.stringify(body)});
const la=localActivity();la.unshift({id:Date.now().toString(),action:id?"UPDATE":"CREATE",details:`${body.type} ${body.name} → ${body.content}`,at:new Date().toISOString()});localStorage.setItem("yasam_activity",JSON.stringify(la.slice(0,100)));
$("#modal").classList.add("hidden");toast(id?"Record updated":"Record created");await load();}catch(e){toast(e.message)}}
function openModal(r=null){$("#recordId").value=r?.id||"";$("#modalTitle").textContent=r?"Edit DNS Record":"Add DNS Record";$("#name").value=r?.name||"";$("#type").value=r?.type||"A";$("#content").value=r?.content||"";$("#ttl").value=r?.ttl===1?"auto":String(r?.ttl||"auto");$("#priority").value=r?.priority??10;$("#proxied").checked=!!r?.proxied;$("#comment").value=r?.comment||"";$("#type").dispatchEvent(new Event("change"));$("#modal").classList.remove("hidden")}
async function del(id){if(!confirm("Delete this DNS record?"))return;try{await api("/api/record?id="+encodeURIComponent(id),{method:"DELETE"});const la=localActivity();la.unshift({id:Date.now().toString(),action:"DELETE",details:`DNS record ${id}`,at:new Date().toISOString()});localStorage.setItem("yasam_activity",JSON.stringify(la.slice(0,100)));toast("Record deleted");load()}catch(e){toast(e.message)}}
function render(){const q=$("#search").value.toLowerCase(),f=$("#filter").value;const list=records.filter(r=>(!f||r.type===f)&&(!q||[r.name,r.type,r.content].join(" ").toLowerCase().includes(q)));$("#rows").innerHTML=list.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="pill">${r.type}</span></td><td style="max-width:320px;word-break:break-all">${esc(r.content)}</td><td>${r.ttl===1?"Auto":r.ttl+"s"}</td><td>${r.proxied?'<span class="orange">🟠 ON</span>':'<span class="muted">⚪ OFF</span>'}</td><td><div class="actions"><button class="btn small secondary" onclick='openModal(${JSON.stringify(r)})'>Edit</button><button class="btn small danger" onclick="del('${r.id}')">Delete</button></div></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No records found</td></tr>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){try{const j=await api("/api/records?per_page=100");records=j.result||[];$("#total").textContent=records.length;$("#ipCount").textContent=records.filter(r=>["A","AAAA"].includes(r.type)).length;$("#cnameCount").textContent=records.filter(r=>r.type==="CNAME").length;$("#proxyCount").textContent=records.filter(r=>r.proxied).length;$("#recent").innerHTML=records.slice(0,8).map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(r.name)}</b> <span class="pill">${r.type}</span><div class="muted">${esc(r.content)}</div></div>`).join("")||'<div class="empty">No records</div>';render();const h=await api("/api/health");$("#zoneLabel").textContent=h.zone?"Zone: "+h.zone:"Cloudflare connected"}catch(e){toast(e.message)}}
$("#search").oninput=render;$("#filter").onchange=render;$("#refresh").onclick=load;
$("#checkBtn").onclick=async()=>{const n=$("#checkName").value.trim();$("#checkResult").textContent="Checking…";try{const j=await api("/api/check?name="+encodeURIComponent(n));$("#checkResult").textContent=JSON.stringify(j.results,null,2)}catch(e){$("#checkResult").textContent=e.message}}
function localActivity(){try{return JSON.parse(localStorage.getItem("yasam_activity")||"[]")}catch{return[]}}
function loadActivity(){api("/api/activity").then(j=>{const server=j.items||[], local=localActivity();const all=[...server,...local].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,100);$("#activityList").innerHTML=all.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(x.action)}</b> — ${esc(x.details)}<div class="muted">${new Date(x.at).toLocaleString()}</div></div>`).join("")||'<div class="empty">No activity yet</div>';$("#activityNote").textContent=server.length?"Persistent Cloudflare KV activity log enabled.":"Persistent KV is not configured; local browser activity may be shown only on this device."}).catch(()=>{})}
boot();
</script>
</body></html>
